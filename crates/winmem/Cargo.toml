[package]
name = "winmem"
version = "0.1.0"
edition = "2024"
description = "Lightweight Windows cross-process memory reading/writing library"
license = "MIT"
keywords = ["windows", "memory", "process", "reverse-engineering"]
categories = ["os::windows-apis"]

[dependencies]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
]
