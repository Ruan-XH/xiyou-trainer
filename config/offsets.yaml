# -----------------------------------------------------------------------------
#  玩家结构里的字段
# -----------------------------------------------------------------------------
#  rel   相对 player_anchor，可以为负（负的字段在血量地址前面）
#  scale 按哪一套间距递推：player / item / none
#  type  读取宽度，必须和程序里的读法一致，写错会报错而不是静默生效
# -----------------------------------------------------------------------------
player_fields:

  # 血量，锚点本身。rel 必须为 0，改别的值会报错。
  hp:
    rel: 0x0
    scale: player
    type: u16

  # 气槽。96 满。
  qi:
    rel: 0xB5
    scale: player
    type: u8

  # 角色 ID：0 孙悟空 / 1 猪八戒 / 2 沙悟净 / 3 小龙女 / 4 龙马
  # 地址 = ram_base + 0x1BE98 - 0x0C + index × 0x13E，也就是 0x1BE8C 起那一排。
  #
  # ⚠️ 这里以前写的是 +0x603（0x1C49B 起），只对 1P 碰巧正确：
  #    1P 读到 1（八戒）没问题，2P/3P 一律读成 0（被当成悟空），4P 读成 192（未知）。
  #    改成 +0x4B（相对血量锚点 -0xC）之后四人全对：
  #        1P 八戒 1 / 2P 悟空 0 / 3P 悟净 2 / 4P 小龙女 3
  character:
    rel: -0x0C
    scale: player
    type: u8

  # 道具光标：0 基，指向道具环里第几件。
  # 注意用 item 间距（0x7E），且基准是 1P 锚点，不是各自的血量地址。
  cursor:
    rel: -0xACFC
    scale: item
    type: u8

  # 道具环起点。每件道具 2 字节：[数量][ID]，见 item_ring。
  # 同样用 item 间距。
  items:
    rel: -0xAD0D
    scale: item
    type: u8

  # 玩家是否在场：0 = 空槽，2 = 这个位置有人（实测 1~4 人全放过，有人的都是 2）。
  # 地址 = ram_base + 0x1BE98 - 0x57 + index × 0x13E
  #      = 0x1BE41（1P）/ 0x1BF7F / 0x1C0BD / 0x1C1FB（4P）
  #
  # 它是这套玩家结构的**第一个字节**，比血量早 0x57；界面判断有没有人只看它。
  #
  # 实测过程（同一局里逐个投币）：
  #   1 人 → 2 0 0 0
  #   2 人 → 2 2 0 0
  #   3 人 → 2 2 2 0
  #   4 人 → 2 2 2 2
  #   15 秒采样纹丝不动。
  #
  # 为什么不能用别的候选（都试过，全部淘汰）：
  #   * character（+0x603）：空槽读出来也是 0，而 0 就是孙悟空的编号，分不清
  #     「有人玩悟空」和「这个位置没人」，而且对 2P 之后的位置常常读不到。
  #   * +0x61（0x1BEF9 那一排）：会被受击 / 过关改写成 0 或 1，1P 明明在玩却变成 0。
  #   * +0x4A：只在 1P 和 2P 加过时短暂吻合，其实是朝向之类的数据（0x80/0x10/0xC0）。
  #   * hp（+0x00）：空槽会残留上一局的 72 / 68，看着像有人。
  active:
    rel: -0x57
    scale: player
    type: u8


# -----------------------------------------------------------------------------
#  敌兵结构里的字段
# -----------------------------------------------------------------------------
#  rel 相对 enemy_anchor，同样按 stride_player 递推（6 个槽）。
# -----------------------------------------------------------------------------
#
#  ── 关于「小兵是否存活」──────────────────────────────────────────────
#  ✅ 2026-10-31 已定位：enemy_fields.active（rel = -0x57，即 0x11A31 起、
#     间隔 0x13E 的那一排）。值 0 = 空槽，2 = 这槽有活着的敌人。
#
#  实测证据（PID 15012，场上先 1 只、后刷 3 只）：
#    · 1 只真兵：flag = [2,0,0,0,0,0]，而同帧 4 号槽血量残留 20（假的）
#    · 刷出 3 只：flag 同一帧变 [2,2,2,0,0,0]，三槽血量同时变 20
#    · 三次「血量归零 → 槽位释放」全部对上，flag 滞后约 1.2 秒归 0
#      （死亡动画期间仍是 2，人还在屏幕上，这个滞后正合适，不用补偿）
#    · 受击掉血（20→8→3）期间 flag 恒为 2，不随损伤变化
#    · 全程只出现 0 / 2 两个值，没有中间态
#
#  位置规律和玩家表一致（玩家的 active 也是血量锚点 -0x57），算是同一套结构。
#
#  已证伪的候选（不要再试）：
#    1) 血量 hp：0 号槽残留 BOSS 的 560 血、4/5 号槽残留 20 血，
#       但场上并没有这些敌人 —— 死槽不清零，新兵直接复用槽位。
#    2) rel = +0xE6（旧结论，已推翻）：跟踪同一槽「活→死→重生」4 个事件，
#       该字节全程恒为 3，死亡时并不归零。之前的「死亡瞬间归零」是误采到
#       另一帧/另一槽的瞬时值。
#    3) rel = +0xE5：同上，全程恒为 1。且 0 号与 1 号槽的该字节会同步跳变，
#       说明它是被按帧广播的共享状态，不是每槽独立的标志。
#    4) rel = -0x28：是个倒计时器（活着时在 1..29 之间来回走，死后重置为 27），
#       死亡那一帧恰好等于 0，纯属时间巧合。
#    5) X 坐标变化（老的「活性检测」）：只能事后判断，单帧读不出真假，
#       静止不动的小兵会被误判成空槽，已弃用。
# -----------------------------------------------------------------------------
enemy_fields:

  # 在场标志：0 = 空槽，2 = 这槽有活着的敌人。**判存活只看它。**
  # 地址 = ram_base + 0x11A88 - 0x57 + index × 0x13E = ram_base + 0x11A31 + index × 0x13E
  active:
    rel: -0x57
    scale: player
    type: u8

  # 血量。>0 不等于存活（死槽会残留血量）。
  hp:
    rel: 0x0
    scale: player
    type: u16

  # X 坐标。老版本靠它「有没有变化」做活性检测，现在存活判定改用 active，
  # 这里只留给调试 / 以后画小地图用。
  # 地址 = ram_base + 0x11A88 - 0x2B + index × 0x13E = ram_base + 0x11A5D + index × 0x13E
  x:
    rel: -0x2B
    scale: player
    type: u8

  # 敌人类型（"小兵种类"）。2026-10-29 场景实测（场上 1 BOSS + 2 只同类小兵）确认成立。
  #
  # 地址 = ram_base + 0x11A88 - 0x34 + index × 0x13E = ram_base + 0x11A54 + index × 0x13E
  # 值是 3 字节的 ROM 对象定义指针（按 u32 读，第 4 字节恒为 0，不影响）。
  #
  # 实测 6 个槽：
  #   E0 (BOSS, 116 血)        = 0x2465B6
  #   E1 (小兵, 同类)          = 0x240044   ┐ 完全相同
  #   E2 (小兵, 同类)          = 0x240044   ┘
  #   E3 (上场景残留, 另一种)  = 0x233B54   ┐ 完全相同
  #   E4 (上场景残留, 同上)    = 0x233B54   ┘
  #   E5 (上场景残留, 又一种)  = 0x237166
  #
  # 稳定性：20 秒 100 次采样，6 个槽全部一字不变；同期 X 坐标在变、
  # 血量在掉（BOSS 138→116），说明它不随移动/动画/受伤改变 —— 是"种类"不是"状态"。
  #
  # ⚠️ 注意：死亡后该值不清零（E2 hp=0 时仍保留小兵类型），所以它只能回答
  #    "这个槽装的是哪种敌人"，不能回答"这个槽的敌人还活着吗"。
  #    判存活仍需配合上面的活性检测。
  #
  # 同结构里 -0x40..-0x30 整段（对象定义头）在同种敌人之间也完全一致，
  # 想扩展更多字段可以从这一段继续挖。
  type:
    rel: -0x34
    scale: player
    type: u32


# -----------------------------------------------------------------------------
#  道具环的内部布局（相对 items 地址）
# -----------------------------------------------------------------------------
#  内存长这样（每格 2 字节，容量 8）：
#
#      环起点 → [数量0][ID0] [数量1][ID1] ... [数量7][ID7] [ ? ][总数]
#                 +0       +1      +2     +3            +16  +17  +18
#
#  · ID 在条目的第 0 字节，数量在前一字节，所以 count_rel = -1
#  · 现行游戏里「当前道具总数」在环起点 +18（8 × 2 + 2）
#  · ID 1 = 空，2..=23 才是真道具
#  · capacity 固定 8：界面是 3×3 八边形槽位
# -----------------------------------------------------------------------------
item_ring:
  capacity: 8
  entry_size: 2
  id_rel: 0
  count_rel: -1
  total_rel: 18
  id_min: 2
  id_max: 23


# -----------------------------------------------------------------------------
#  自定义监视项：加在这里就会出现在界面底部，并参与 --dump-offsets 输出
# -----------------------------------------------------------------------------
#  一条监视项 = 一个地址表达式：
#
#      final = base + offset + index × stride
#      然后按 deref 依次「读 u32 当指针 → 加偏移」
#
#  base   ram（相对 RAM 首地址，绝大多数情况）/ module（相对模拟器模块基址）
#  scale  player / item / none，配合 index 取第 N 个玩家的字段
#  deref  指针链，空表示直接读；每一层 = 读 u32 + 加这个偏移
#
#  ── 模板（去掉 # 就能用，注意缩进和列表的「-」）────────────────────────
#
#  watches:
#
#    # 直接读：RAM + 0x0123，u32
#    - id: score
#      name: 分数
#      type: u32
#      address:
#        base: ram
#        offset: 0x0123
#
#    # 指针链：等价于 CE 的 [[ram_base+0x100]+0x10]+0x8
#    - id: boss_hp
#      name: BOSS 血量
#      type: u16
#      address:
#        base: ram
#        offset: 0x0100
#        deref: [0x10, 0x8]
#
#    # 按玩家序号取字段：index 0 就是 1P
#    - id: p2_hp
#      name: 2P 血量
#      type: u16
#      address:
#        base: ram
#        offset: 0x1BE98
#        scale: player
#        index: 1
# -----------------------------------------------------------------------------
watches: []


# =============================================================================
#  还没定位的地址（留位，找到后按上面的格式补进对应段落）
# =============================================================================
#
#  · 移速：玩家结构里，跟血量同一套 stride_player 递推
#  · 分数 / 关卡：u32，用 CE 搜变动值最省事
#  · 无敌帧 / 受击判定：通常反汇编血量写入点往回找
#  · 敌兵数量上限：enemy_anchor 附近按 stride_player 递推逐个试
#    （敌兵类型 2026-10-29 已定位，见 enemy_fields.type）
#
#  找新地址的流程：CE 附加 fba.exe → 先确认 ram_ptr_offset 读出来的
#  RAM 首地址和看板显示一致 → 用「未知初始值 + 变动/未变动」筛 →
#  算成「相对 ram_base 的偏移」写进上面 → 重启看板验证。
#
#  ⚠️ CE 里记得关掉「设置 → 其它 → 查询常规内存区」，
#     否则扫大范围内存容易 CLOCK_WATCHDOG_TIMEOUT 蓝屏。
# =============================================================================
