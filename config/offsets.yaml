# =============================================================================
#  西游释厄传（Oriental Legend）/ FBA 模拟器 —— 内存地址表
# =============================================================================
#
#  这份 YAML 就是全部地址的唯一来源，代码里没有写死任何一个偏移。
#  改这里 → 重启看板 → 生效。找不到文件时程序用编译进二进制的同一份副本。
#
#  写法约定：
#    · 数值可以写 0x01120518（十六进制）、-0xACFC（负的十六进制）、114328（十进制），
#      三种效果完全一样，想怎么写就怎么写，程序都认。
#    · 以 # 开头的都是注释，程序不看，随便写。
#
#  ── 寻址公式 ─────────────────────────────────────────────────────────────
#
#    [1] RAM 首地址
#          模块基址 + ram_ptr_offset  →  读 u32  →  ram_base
#        （ram_ptr_offset 是「RAM 指针」这个变量在模拟器 exe 里的位置，
#          它每次运行都会变，所以只能存偏移，运行时现读。）
#
#    [2] 固定偏移字段（剩余时间…）
#          ram_base + layout 里的偏移
#
#    [3] 玩家 / 敌兵字段
#          ram_base + player_anchor(或 enemy_anchor) + 字段.rel + 序号 × 间距
#        （序号 0 = 1P / 1 号敌兵，间距按字段.scale 取：
#            player → stride_player，item → stride_item，none → 不加）
#
#    [4] 模拟器自身变量
#          模块基址 + 偏移（addr.base 写 module 时走这条）
#
#  校验：任何一项填错（比如 stride 写成 0、capacity 不是 8、hp.rel 不是 0），
#  启动时会红字提示并用内置副本，不会静默跑偏。
# =============================================================================

schema_version: 1

game: 西游 · V126


# -----------------------------------------------------------------------------
#  模拟器：RAM 指针在哪
# -----------------------------------------------------------------------------
#  同一份游戏数据，不同模拟器放在 exe 里的指针位置不一样，所以按 exe 名分别登记。
#  除 ram_ptr_offset 这一项，下面所有偏移对 FBA-rr 和 FBAS 通用。
#  ram_ptr_offset 会随模拟器版本 / 编译方式变化，换了版本要重新找。
# -----------------------------------------------------------------------------
emulators:

  - id: fba
    label: FBA-rr
    exe: fba.exe
    # RAM 指针变量相对模块基址的位置
    ram_ptr_offset: 0x01120518
    desc: FBA-rr 主程序

  - id: fbas
    label: FBAS
    exe: fbas.exe
    # FBAS 和 FBA-rr 的差异只在这一行
    ram_ptr_offset: 0x00A7CC64
    desc: FBAS 主程序


# -----------------------------------------------------------------------------
#  布局：相对 RAM 首地址的固定偏移
# -----------------------------------------------------------------------------
#  这些是游戏自身的数据结构布局，跟模拟器无关，换 ROM 一般也不变。
#  单位：字节。全部相对 ram_base。
# -----------------------------------------------------------------------------
layout:

  # 剩余时间，u8。原版界面上显示的是原始计数，不是秒。
  time: 0xC06F

  # 关卡号，0 基：第 1 关 = 0、第 2 关 = 1、第 3 关 = 2……显示时 +stage_bias。
  #
  # 怎么找到的：切存档停在 1 / 2 / 3 关，各存一份 256KB 全 RAM 快照，
  # 要求「关1=0、关2=1、关3=2」且此刻在关卡内连采 10 次（3.5 秒）纹丝不动。
  # 命中 8 个，其中 7 个落在 0x028xxx 的脚本表里（F0 xx 4x 的指针模式），
  # 只有这一格在游戏状态区，取它。
  #
  # ⚠️ 曾经误采过 0xC5DE：它在 1/2/3 关的快照里正好是 1/2/3，看着完美，
  #    但那是「关卡内小节号」——同一关里打着打着就自己涨（实测 3 → 7），
  #    所以 1 基编码现在一个候选都不剩。找这类东西必须「三关 + 本关内稳定性」双筛。
  stage: 0xC03B

  # 显示用的偏移：界面显示 stage + stage_bias。0 基表要 +1 才是关卡号。
  stage_bias: 1

  # ⚠️ 小关号（0xC5DE）已弃用，配置里刻意不留这一项，界面也不再显示。
  #
  # 这一格在 1/2/3 关的快照里恰好读到 1/2/3，看着像关卡号；后来发现它是
  # 「关卡内的小节计数」，同一关里打着打着就自己涨（第 3 关实测 1 → 7）。
  # 当成小关显示之后，它在实机上会毫无规律地乱跳（切存档、过场景都会变），
  # 玩家看着像看板坏了，所以整条链路一起撤掉了。
  #
  # 想恢复得先找到「进关归 1、关内不乱跳」的真正小节地址，别复用 0xC5DE。

  # 1P 血量地址，一切玩家字段的锚点。
  # 1P 血量本身就是「rel = 0」那个字段，所以这个值必须和 player_fields.hp.rel 配合看。
  player_anchor: 0x1BE98

  # 1 号敌兵血量，敌兵字段的锚点；后续敌兵按 stride_player 递推。
  enemy_anchor: 0x11A88

  # 玩家之间两套间距，不能混用：
  #   血量 / 气槽 / 角色 ID / 在场标志   用 0x13E
  #   道具光标 / 道具环                  用 0x7E
  stride_player: 0x13E
  stride_item: 0x7E


# -----------------------------------------------------------------------------
#  显示多少个槽位
# -----------------------------------------------------------------------------
#  改这里界面跟着变，不用动代码。players 上限 8（总览一行一个），enemies 上限 16。
# -----------------------------------------------------------------------------
counts:
  players: 4
  enemies: 6


# -----------------------------------------------------------------------------
#  常量
# -----------------------------------------------------------------------------
limits:
  # 气槽上限。原版是写死的常量，所有角色都一样，满了就是 96。
  qi_max: 96
  # 玩家血条满值，只用来算血条长度的比例。所有角色一致：72 血 / 96 气。
  hp_max: 72


# -----------------------------------------------------------------------------
#  敌兵类型对照表
# -----------------------------------------------------------------------------
#  enemy_fields.type 读出来的是 ROM 对象定义指针，同种敌人相同、换场景也不变。
#  这里给它起名字，界面就直接显示名字；表里没有的类型会显示成 6 位编号，
#  看到没见过的就把那一行补进来，重启看板即生效。
#
#  name 后面括号里是五行属性，max 是这种敌人的满血值（只影响血条长度，
#  不影响读到的血量；血量超过 max 时血条按满格算）。
#
#  表来源：2026-10-30 整理的全兵种对照表，44 种，按属性分组。
